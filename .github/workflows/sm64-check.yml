name: SM64 Rust checks

on:
  push:
    branches: [main]
    paths:
      - "crates/sm64_core/**"
      - "crates/sm64_sim/**"
      - "crates/sm64_bevy/**"
      - "crates/bootstrap/**"
      - "crates/launcher/**"
      - "tools/sm64_native_bridge/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sm64-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check SM64 integration
        run: cargo check -p sm64_core -p sm64_assets -p sm64_sim -p sm64_bevy -p bootstrap -p launcher --tests
